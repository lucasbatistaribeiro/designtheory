# Fontes da newsletter.
# type: rss  -> feed RSS/Atom (o único tipo implementado hoje)
# weight    -> multiplicador de pontuação da fonte (1.0 = neutro)
# enabled   -> false desliga a fonte sem apagar a linha
#
# Rode `python -m newsletter validate` depois de editar para checar se
# todos os feeds respondem.

sources:
  - name: Smashing Magazine
    category: Web & Front-end
    type: rss
    url: https://www.smashingmagazine.com/feed/
    weight: 1.2
    enabled: true

