name: Newsletter semanal

on:
  # Toda segunda-feira às 09:00 no horário de Brasília (12:00 UTC)
  schedule:
    - cron: "0 12 * * 1"
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só gerar e mostrar a edição, sem gravar nem enviar"
        type: boolean
        default: false
      no_send:
        description: "Gravar a edição mas não enviar e-mail"
        type: boolean
        default: false
      window_days:
        description: "Janela de coleta em dias"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar edição
        id: build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
        run: |
          ARGS="build --verbose"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_send }}" = "true" ]; then ARGS="$ARGS --no-send"; fi
          if [ -n "${{ inputs.window_days }}" ]; then ARGS="$ARGS --window-days ${{ inputs.window_days }}"; fi
          python -m newsletter $ARGS

      - name: Publicar edição no repositório
        if: steps.build.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues data
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "newsletter: edição ${{ steps.build.outputs.slug }} (${{ steps.build.outputs.items }} itens)"
            git push
          fi

      - name: Resumo
        if: always()
        run: |
          echo "### Newsletter" >> $GITHUB_STEP_SUMMARY
          echo "- publicada: ${{ steps.build.outputs.published || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- itens: ${{ steps.build.outputs.items || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- edição: ${{ steps.build.outputs.slug || '—' }}" >> $GITHUB_STEP_SUMMARY
